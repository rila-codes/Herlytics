version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: herlytics-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: herlytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d herlytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai:
    build: ./ai
    container_name: herlytics-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    container_name: herlytics-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/herlytics
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - AI_SERVICE_URL=http://ai:8000
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: herlytics-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
